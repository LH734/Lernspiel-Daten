// ===== HELFER =====
const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
const baueOptionen = (richtig, kandidaten) => {
  const set = new Set(); set.add(String(richtig));
  for (const k of kandidaten) { if (set.size >= 4) break; set.add(String(k)); }
  let i = 0; while (set.size < 4 && i < 50) { set.add(String(randInt(1, 99) + i * 7)); i++; }
  const arr = [...set].slice(0, 4);
  if (!arr.includes(String(richtig))) arr[0] = String(richtig);
  return shuffle(arr);
};

// ===== STATISTIK =====
const med_ = (arr) => { const s = [...arr].sort((a, b) => a - b); const n = s.length; if (n % 2 === 1) return s[Math.floor(n/2)]; return (s[n/2-1] + s[n/2]) / 2; };
const avg_ = (arr) => arr.reduce((s, v) => s + v, 0) / arr.length;
const spn_ = (arr) => Math.max(...arr) - Math.min(...arr);
const mod_ = (arr) => { const c = {}; arr.forEach(v => { c[v] = (c[v] || 0) + 1; }); const m = Math.max(...Object.values(c)); if (m === 1) return null; const ms = Object.entries(c).filter(([, v]) => v === m); return ms.length === 1 ? parseFloat(ms[0][0]) : null; };
const fmt = (n) => { if (Math.abs(n - Math.round(n)) < 1e-9) return `${Math.round(n)}`; return n.toFixed(2).replace('.', ',').replace(/,?0+$/, ''); };
const eq = (a, b) => Math.abs(a - b) < 1e-9;

// ===== EINGABE-PARSER =====
const parseStichprobe = (input) => {
  if (!input || !input.trim()) return { error: 'Bitte gib Werte ein. Trenne sie mit Semikolon (;).' };
  const parts = input.split(';').map(p => p.trim()).filter(p => p.length > 0);
  if (parts.length === 0) return { error: 'Keine gültigen Werte gefunden.' };
  const nums = [];
  for (const p of parts) {
    if (!/^-?\d+(?:[.,]\d+)?$/.test(p)) return { error: `"${p}" ist keine gültige Zahl. Trenne Werte mit ; — Dezimalzahlen mit Komma (z. B. 3,5).` };
    nums.push(parseFloat(p.replace(',', '.')));
  }
  return { values: nums };
};

const v_modusKleinerMedian = (n) => {
  if (n.length !== 5) return { valid: false, msg: `Bitte genau 5 Werte angeben (du hast ${n.length}).` };
  const m = mod_(n); const md = med_(n);
  if (m === null) return { valid: false, msg: 'Keine eindeutige häufigste Zahl. Eine Zahl muss öfter vorkommen als alle anderen.' };
  if (m >= md) return { valid: false, msg: `Modalwert = ${fmt(m)}, Median = ${fmt(md)}. Der Modalwert ist NICHT kleiner als der Median.` };
  return { valid: true, msg: `Modalwert = ${fmt(m)}, Median = ${fmt(md)} → ${fmt(m)} < ${fmt(md)} ✓` };
};
const v_modusGleichMedian = (n) => {
  if (n.length !== 5) return { valid: false, msg: `Bitte genau 5 Werte angeben (du hast ${n.length}).` };
  const m = mod_(n); const md = med_(n);
  if (m === null) return { valid: false, msg: 'Keine eindeutige häufigste Zahl. Eine Zahl muss öfter vorkommen als alle anderen.' };
  if (!eq(m, md)) return { valid: false, msg: `Modalwert = ${fmt(m)}, Median = ${fmt(md)}. Diese sind nicht gleich.` };
  return { valid: true, msg: `Modalwert = Median = ${fmt(m)} ✓` };
};
const v_modusGleichMittel = (n) => {
  if (n.length !== 5) return { valid: false, msg: `Bitte genau 5 Werte angeben (du hast ${n.length}).` };
  const m = mod_(n); const a = avg_(n);
  if (m === null) return { valid: false, msg: 'Keine eindeutige häufigste Zahl.' };
  if (!eq(m, a)) return { valid: false, msg: `Modalwert = ${fmt(m)}, arithm. Mittel = ${fmt(a)}. Diese sind nicht gleich.` };
  return { valid: true, msg: `Modalwert = arithm. Mittel = ${fmt(m)} ✓` };
};
const v_modusGroesserMittel = (n) => {
  if (n.length !== 5) return { valid: false, msg: `Bitte genau 5 Werte angeben (du hast ${n.length}).` };
  const m = mod_(n); const a = avg_(n);
  if (m === null) return { valid: false, msg: 'Keine eindeutige häufigste Zahl.' };
  if (m <= a) return { valid: false, msg: `Modalwert = ${fmt(m)}, arithm. Mittel = ${fmt(a)}. Der Modalwert ist NICHT größer als das Mittel.` };
  return { valid: true, msg: `Modalwert = ${fmt(m)} > arithm. Mittel = ${fmt(a)} ✓` };
};
const v_mittelGleichMedian = (n) => {
  if (n.length !== 5) return { valid: false, msg: `Bitte genau 5 Werte angeben (du hast ${n.length}).` };
  const md = med_(n); const a = avg_(n);
  if (!eq(md, a)) return { valid: false, msg: `Median = ${fmt(md)}, arithm. Mittel = ${fmt(a)}. Diese sind nicht gleich.` };
  return { valid: true, msg: `Median = arithm. Mittel = ${fmt(md)} ✓` };
};
const v_spann4Med10 = (n) => {
  if (n.length !== 5) return { valid: false, msg: `Bitte genau 5 Werte angeben (du hast ${n.length}).` };
  const s = spn_(n); const md = med_(n);
  if (!eq(s, 4)) return { valid: false, msg: `Spannweite = ${fmt(s)} (soll 4 sein), Median = ${fmt(md)}.` };
  if (!eq(md, 10)) return { valid: false, msg: `Spannweite = 4 ✓, aber Median = ${fmt(md)} (soll 10 sein).` };
  return { valid: true, msg: `Spannweite = 4 ✓, Median = 10 ✓` };
};
const v_mittelDoppeltSpann = (n) => {
  if (n.length !== 5) return { valid: false, msg: `Bitte genau 5 Werte angeben (du hast ${n.length}).` };
  const a = avg_(n); const s = spn_(n);
  if (eq(s, 0)) return { valid: false, msg: 'Spannweite = 0 (alle Werte gleich). Das Mittel kann hier nicht doppelt so groß sein.' };
  if (!eq(a, 2 * s)) return { valid: false, msg: `Arithm. Mittel = ${fmt(a)}, Spannweite = ${fmt(s)}. ${fmt(a)} ≠ 2 · ${fmt(s)} = ${fmt(2 * s)}.` };
  return { valid: true, msg: `Arithm. Mittel = ${fmt(a)} = 2 · ${fmt(s)} (Spannweite) ✓` };
};

// ===== BATTLE-MODUS =====
const generateBattleQuestion = () => {
  const typ = randInt(1, 5);
  if (typ === 1) {
    const modeVal = randInt(5, 25);
    const others = [];
    while (others.length < 3) { const v = randInt(5, 30); if (v !== modeVal && !others.includes(v)) others.push(v); }
    const data = [modeVal, modeVal, modeVal, others[0], others[1], others[2]];
    if (Math.random() < 0.4) data.push(others[0]);
    const shown = shuffle(data);
    const optionen = baueOptionen(modeVal, others);
    const item = choice(['Spurenmessungen (cm)', 'Verdächtigen-Schuhgrößen', 'Anrufe pro Tag', 'Tatzeiten (Uhr)']);
    return { frage: `${item}: ${shown.join('; ')}. Modalwert?`, optionen, richtig: optionen.indexOf(String(modeVal)) };
  }
  if (typ === 2) {
    const vals = [];
    while (vals.length < 5) { const v = randInt(5, 35); if (!vals.includes(v)) vals.push(v); }
    vals.sort((a, b) => a - b);
    const median = vals[2];
    const distractors = [vals[0], vals[1], vals[3], vals[4]];
    const shown = shuffle([...vals]);
    const optionen = baueOptionen(median, distractors);
    return { frage: `Tatzeitpunkte (Uhr): ${shown.join('; ')}. Median?`, optionen, richtig: optionen.indexOf(String(median)) };
  }
  if (typ === 3) {
    const mean = randInt(6, 15);
    const vals = [mean - 2, mean - 1, mean, mean + 1, mean + 2];
    const shown = shuffle([...vals]);
    const optionen = baueOptionen(mean, [mean + 1, mean - 1, mean + 2, mean - 2]);
    return { frage: `Hinweise pro Tag: ${shown.join('; ')}. Arithmetisches Mittel?`, optionen, richtig: optionen.indexOf(String(mean)) };
  }
  if (typ === 4) {
    const min = randInt(2, 8);
    const range = randInt(5, 18);
    const max = min + range;
    const mids = [];
    while (mids.length < 3) { const v = randInt(min + 1, max - 1); if (!mids.includes(v)) mids.push(v); }
    const vals = shuffle([min, ...mids, max]);
    const optionen = baueOptionen(range, [max, min, range + 3, range - 2]);
    return { frage: `Lösegeldforderungen (1.000 €): ${vals.join('; ')}. Spannweite?`, optionen, richtig: optionen.indexOf(String(range)) };
  }
  const knobel = [
    { f: 'Daten: 5; 7; 8; 100. Welcher Kennwert ist robust gegenüber dem Ausreißer 100?', r: 'Der Median', falsch: ['Das arithmetische Mittel', 'Die Spannweite', 'Der größte Wert'] },
    { f: 'Datenreihe: 4; 4; 4; 7; 9. Modalwert?', r: '4', falsch: ['7', '5,6', '9'] },
    { f: 'Werte: 3; 5; 7; 9; 11. Median?', r: '7', falsch: ['5', '9', '11'] },
    { f: 'Werte: 2; 4; 6; 8; 10. Spannweite?', r: '8', falsch: ['6', '10', '2'] },
    { f: 'Welcher Kennwert passt zu Lieblingsfarben?', r: 'Der Modalwert', falsch: ['Der Median', 'Das arithmetische Mittel', 'Die Spannweite'] },
    { f: 'Werte: 5; 5; 5; 5; 5. Spannweite?', r: '0', falsch: ['5', '25', '1'] },
    { f: 'Werte: 2; 4; 6; 8. Median (gerade Anzahl)?', r: '5', falsch: ['4', '6', '4,5'] },
  ];
  const a = choice(knobel);
  const optionen = shuffle([a.r, ...a.falsch]);
  return { frage: a.f, optionen, richtig: optionen.indexOf(a.r) };
};

const generateRandomCode = () => {
  const codes = ['AKTE', 'FALL', 'SPUR', 'INDIZ', 'BEWEIS', 'COLD', 'NOIR'];
  return `${choice(codes)}-${randInt(1000, 9999)}`;
};

  const [compP2, setCompP2] = useState('');
  const [compP1Code, setCompP1Code] = useState('');
  const [compP2Code, setCompP2Code] = useState('');
  const [compTurn, setCompTurn] = useState(1);
  const [compErrors, setCompErrors] = useState({ 1: 0, 2: 0 });
  const [compQuestion, setCompQuestion] = useState(null);
  const [compSelected, setCompSelected] = useState(null);
  const [compShowFeedback, setCompShowFeedback] = useState(false);
  const [compRound, setCompRound] = useState(1);
  const [compWinner, setCompWinner] = useState(null);

  const allAktenDone = completedAkten.length >= akten.length;

  useEffect(() => {
    if (allAktenDone && !masterCode) setMasterCode(generateRandomCode());
  }, [allAktenDone, masterCode]);

    setCurrentAkte(akteId);
    setAkteQuestions(shuffle(akten[akteId].generator()));
    setQuestionIdx(0); setAkteScore(0); setAkteErrors(0);
    setSelectedAnswer(null); setShowFeedback(false);
    setInputText(''); setInputError(null); setInputResult(null);
    setScreen('akte');
  };

  const submitAnswer = (idx) => {
    if (showFeedback) return;
    setSelectedAnswer(idx); setShowFeedback(true);
    if (idx === akteQuestions[questionIdx].richtig) setAkteScore(akteScore + 1);
    else setAkteErrors(akteErrors + 1);
  };

  const submitInput = () => {
    if (showFeedback) return;
    const q = akteQuestions[questionIdx];
    const parsed = parseStichprobe(inputText);
    if (parsed.error) { setInputError(parsed.error); return; }
    setInputError(null);
    const result = q.validator(parsed.values);
    setInputResult(result); setShowFeedback(true);
    if (result.valid) setAkteScore(akteScore + 1);
    else setAkteErrors(akteErrors + 1);
  };

  const nextQuestion = () => {
    if (questionIdx + 1 >= akteQuestions.length) {
      const newCompleted = completedAkten.includes(currentAkte) ? completedAkten : [...completedAkten, currentAkte];
      setCompletedAkten(newCompleted);
      if (newCompleted.length >= akten.length) setScreen('finished');
      else setScreen('map');
    } else {
      setQuestionIdx(questionIdx + 1);
      setSelectedAnswer(null); setShowFeedback(false);
      setInputText(''); setInputError(null); setInputResult(null);
    }
  };

  const startCompetitive = () => {
    if (!compP1 || !compP2 || !compP1Code || !compP2Code) return;
    if (!/^[A-ZÄÖÜ]+-\d{4}$/.test(compP1Code) || !/^[A-ZÄÖÜ]+-\d{4}$/.test(compP2Code)) {
      alert('Master-Codes haben das Format BUCHSTABEN-ZAHLEN (z. B. AKTE-1234)'); return;
    }
    setCompTurn(1); setCompErrors({ 1: 0, 2: 0 }); setCompRound(1);
    setCompQuestion(generateBattleQuestion());
    setCompSelected(null); setCompShowFeedback(false); setCompWinner(null);
    setScreen('comp_game');
  };

  const compSubmit = (idx) => {
    if (compShowFeedback) return;
    setCompSelected(idx); setCompShowFeedback(true);
    if (idx !== compQuestion.richtig) {
      const newErrors = { ...compErrors, [compTurn]: compErrors[compTurn] + 1 };
      setCompErrors(newErrors);
      if (newErrors[compTurn] >= 3) {
        setCompWinner(compTurn === 1 ? 2 : 1);
        setTimeout(() => setScreen('comp_end'), 2000);
      }
    }
  };

  const compNext = () => {
    setCompTurn(compTurn === 1 ? 2 : 1);
    setCompRound(compRound + 1);
    setCompQuestion(generateBattleQuestion());
    setCompSelected(null); setCompShowFeedback(false);

          )}

                  </button>
                )}
                {showFeedback && inputResult && (
                  <div className={`mt-5 p-4 rounded-xl ${inputResult.valid ? 'bg-emerald-500/10 border border-emerald-500/40' : 'bg-amber-500/10 border border-amber-500/40'}`}>
                    <p className={`font-bold mb-2 ${inputResult.valid ? 'text-emerald-400' : 'text-amber-400'}`}>{inputResult.valid ? '✓ Stichprobe korrekt!' : '✗ Nicht passend'}</p>
                    <p className="text-stone-200 text-sm leading-relaxed mb-3">{inputResult.msg}</p>
                    {!inputResult.valid && <p className="text-stone-300 text-sm leading-relaxed"><strong className="text-amber-300">{q.erklaerung}</strong></p>}
                  </div>
                )}
              </div>
            ) : (
              <div className="space-y-3">
                {q.optionen.map((opt, idx) => {
                  const isSelected = selectedAnswer === idx;
                  const isCorrect = idx === q.richtig;
                  let buttonClass = 'border-amber-500/30 hover:border-amber-400 hover:bg-amber-500/10';
                  if (showFeedback) {
                    if (isCorrect) buttonClass = 'border-emerald-500 bg-emerald-500/20';
                    else if (isSelected) buttonClass = 'border-red-500 bg-red-500/20';
                    else buttonClass = 'border-zinc-700 opacity-50';
                  }
                  return (
                    <button key={idx} onClick={() => submitAnswer(idx)} disabled={showFeedback} className={`w-full text-left p-4 rounded-xl border-2 transition-all ${buttonClass} ${!showFeedback && 'cursor-pointer'}`}>
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-white">{opt}</span>
                        {showFeedback && isCorrect && <Check className="w-6 h-6 text-emerald-400 flex-shrink-0" />}
                        {showFeedback && isSelected && !isCorrect && <X className="w-6 h-6 text-red-400 flex-shrink-0" />}
                      </div>
                    </button>
                  );
                })}
              </div>
            )}
            {showFeedback && !isInput && (
              <div className={`mt-5 p-4 rounded-xl ${selectedAnswer === q.richtig ? 'bg-emerald-500/10 border border-emerald-500/30' : 'bg-amber-500/10 border border-amber-500/30'}`}>
                <p className={`font-bold mb-1 ${selectedAnswer === q.richtig ? 'text-emerald-400' : 'text-amber-400'}`}>{selectedAnswer === q.richtig ? '✓ Korrekt ermittelt!' : 'Lösung:'}</p>
                <p className="text-stone-200 text-sm leading-relaxed">{q.erklaerung}</p>
              </div>
            )}
            {showFeedback && (
              <button onClick={nextQuestion} className="w-full mt-5 py-3 bg-gradient-to-r from-amber-500 to-red-600 hover:from-amber-600 hover:to-red-700 text-white font-bold rounded-xl flex items-center justify-center gap-2 transition-all">
                {questionIdx + 1 >= akteQuestions.length ? 'Akte schließen' : 'Nächster Hinweis'} <ArrowRight className="w-5 h-5" />
              </button>
            )}
          </div>
        </div>
      </div>
    );
  }

  if (screen === 'finished') {
    return (
      <div className="min-h-screen bg-gradient-to-br from-stone-950 via-zinc-900 to-stone-950 flex items-center justify-center p-4">
        <div className="max-w-2xl w-full bg-zinc-900/80 backdrop-blur-sm rounded-3xl p-8 shadow-2xl border-2 border-amber-500/50 text-center">
          <div className="inline-flex items-center justify-center w-24 h-24 bg-gradient-to-br from-amber-400 to-red-600 rounded-full mb-4 shadow-2xl shadow-amber-500/50 animate-pulse">
            <Trophy className="w-14 h-14 text-white" />
          </div>
          <h1 className="text-4xl font-bold bg-gradient-to-r from-amber-300 to-red-400 bg-clip-text text-transparent mb-2">Meisterdetektiv:in!</h1>
          <p className="text-stone-300 mb-6">Glückwunsch! Du hast alle 6 Akten gelöst und verdienst die <span className="text-amber-300 font-bold">Goldene Lupe</span>.</p>
          <div className="bg-zinc-950/80 rounded-2xl p-6 border-2 border-amber-500/30 mb-6">
            <p className="text-amber-300 text-sm font-medium mb-2 font-mono tracking-wider">DEIN MASTER-CODE</p>
            <p className="text-4xl font-mono font-bold text-amber-300 tracking-wider">{masterCode}</p>
            <p className="text-stone-400 text-xs mt-3">Notiere dir den Code — du brauchst ihn für den Battle-Modus!</p>
          </div>
          <div className="space-y-3">
            <button onClick={() => setScreen('comp_lobby')} className="w-full py-4 bg-gradient-to-r from-red-700 to-red-900 hover:from-red-800 hover:to-red-950 text-white font-bold text-lg rounded-xl shadow-lg flex items-center justify-center gap-2">
              <Swords className="w-5 h-5" /> Battle-Modus starten
            </button>
            <button onClick={() => setScreen('map')} className="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-medium rounded-xl">Zurück zum Aktenschrank</button>
          </div>
        </div>
      </div>
    );
  }

  if (screen === 'comp_lobby') {
    return (
      <div className="min-h-screen bg-gradient-to-br from-stone-950 via-red-950/40 to-stone-950 flex items-center justify-center p-4">
        <div className="max-w-2xl w-full bg-zinc-900/80 backdrop-blur-sm rounded-3xl p-8 shadow-2xl border-2 border-amber-500/50">
          <div className="text-center mb-6">
            <div className="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-amber-500 to-red-700 rounded-2xl mb-3 shadow-lg shadow-red-500/50">
              <Swords className="w-12 h-12 text-white" />
            </div>
            <h1 className="text-4xl font-bold bg-gradient-to-r from-amber-300 to-red-400 bg-clip-text text-transparent mb-2">Ermittler-Duell</h1>
            <p className="text-stone-300">Beide brauchen einen Master-Code.</p>
            <p className="text-stone-400 text-sm mt-1">Wer zuerst 3 Fehler macht, verliert.</p>
          </div>
          <div className="space-y-4 mb-6">
            <div className="bg-zinc-950/60 rounded-2xl p-4 border border-amber-500/30">
              <h3 className="text-amber-300 font-bold mb-3">Detektiv:in 1</h3>
              <input type="text" value={compP1} onChange={(e) => setCompP1(e.target.value)} placeholder="Name..." className="w-full px-4 py-2 bg-zinc-950 border border-amber-500/30 rounded-lg text-white placeholder-stone-500 focus:outline-none focus:border-amber-400 mb-2" maxLength={20} />
              <input type="text" value={compP1Code} onChange={(e) => setCompP1Code(e.target.value.toUpperCase())} placeholder="Master-Code (z. B. AKTE-1234)" className="w-full px-4 py-2 bg-zinc-950 border border-amber-500/30 rounded-lg text-white placeholder-stone-500 focus:outline-none focus:border-amber-400 font-mono" maxLength={15} />
            </div>
            <div className="bg-zinc-950/60 rounded-2xl p-4 border border-red-500/30">
              <h3 className="text-red-400 font-bold mb-3">Detektiv:in 2</h3>
              <input type="text" value={compP2} onChange={(e) => setCompP2(e.target.value)} placeholder="Name..." className="w-full px-4 py-2 bg-zinc-950 border border-red-500/30 rounded-lg text-white placeholder-stone-500 focus:outline-none focus:border-red-400 mb-2" maxLength={20} />
              <input type="text" value={compP2Code} onChange={(e) => setCompP2Code(e.target.value.toUpperCase())} placeholder="Master-Code (z. B. SPUR-5678)" className="w-full px-4 py-2 bg-zinc-950 border border-red-500/30 rounded-lg text-white placeholder-stone-500 focus:outline-none focus:border-red-400 font-mono" maxLength={15} />
            </div>
          </div>
          <button onClick={startCompetitive} disabled={!compP1.trim() || !compP2.trim() || !compP1Code.trim() || !compP2Code.trim()} className="w-full py-4 bg-gradient-to-r from-amber-500 to-red-700 hover:from-amber-600 hover:to-red-800 text-white font-bold text-lg rounded-xl shadow-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
            <Swords className="w-5 h-5" /> Duell starten
          </button>
          <button onClick={() => setScreen(allAktenDone ? 'map' : 'start')} className="w-full mt-3 py-2 text-stone-400 hover:text-white">← Zurück</button>
        </div>
      </div>
    );
  }

  if (screen === 'comp_game' && compQuestion) {
    const currentPlayer = compTurn === 1 ? compP1 : compP2;
    return (
      <div className="min-h-screen bg-gradient-to-br from-stone-950 via-red-950/40 to-stone-950 p-4">
        <div className="max-w-3xl mx-auto">
          <div className="grid grid-cols-2 gap-3 mb-4 mt-2">
            <div className={`bg-zinc-900/80 rounded-xl p-3 border-2 ${compTurn === 1 ? 'border-amber-500 shadow-lg shadow-amber-500/50' : 'border-zinc-700 opacity-60'}`}>
              <p className="text-amber-300 text-xs font-mono">DETEKTIV:IN 1</p>
              <p className="text-white font-bold truncate">{compP1}</p>
              <div className="flex gap-1 mt-2">
                {[0, 1, 2].map(i => <div key={i} className={`w-3 h-3 rounded-full ${compErrors[1] > i ? 'bg-red-500' : 'bg-zinc-700'}`} />)}
              </div>
            </div>
            <div className={`bg-zinc-900/80 rounded-xl p-3 border-2 ${compTurn === 2 ? 'border-red-500 shadow-lg shadow-red-500/50' : 'border-zinc-700 opacity-60'}`}>
              <p className="text-red-400 text-xs font-mono">DETEKTIV:IN 2</p>
              <p className="text-white font-bold truncate">{compP2}</p>
              <div className="flex gap-1 mt-2">
                {[0, 1, 2].map(i => <div key={i} className={`w-3 h-3 rounded-full ${compErrors[2] > i ? 'bg-red-500' : 'bg-zinc-700'}`} />)}
              </div>
            </div>
          </div>
          <div className="bg-zinc-900/80 backdrop-blur-sm rounded-2xl p-4 mb-4 border border-amber-500/30 text-center">
            <p className="text-amber-300 text-sm font-mono">RUNDE {compRound}</p>
            <p className={`text-xl font-bold ${compTurn === 1 ? 'text-amber-300' : 'text-red-400'}`}>{currentPlayer} ermittelt</p>
          </div>
          <div className="bg-zinc-900/80 backdrop-blur-sm rounded-2xl p-6 border border-amber-500/30">
            <p className="text-white text-lg leading-relaxed mb-6">{compQuestion.frage}</p>
            <div className="space-y-3">
              {compQuestion.optionen.map((opt, idx) => {
                const isSelected = compSelected === idx;
                const isCorrect = idx === compQuestion.richtig;
                let buttonClass = compTurn === 1 ? 'border-amber-500/30 hover:border-amber-400 hover:bg-amber-500/10' : 'border-red-500/30 hover:border-red-400 hover:bg-red-500/10';
                if (compShowFeedback) {
                  if (isCorrect) buttonClass = 'border-emerald-500 bg-emerald-500/20';
                  else if (isSelected) buttonClass = 'border-red-500 bg-red-500/20';
                  else buttonClass = 'border-zinc-700 opacity-50';
                }
                return (
                  <button key={idx} onClick={() => compSubmit(idx)} disabled={compShowFeedback} className={`w-full text-left p-4 rounded-xl border-2 transition-all ${buttonClass} ${!compShowFeedback && 'cursor-pointer'}`}>
                    <div className="flex items-center justify-between gap-3">
                      <span className="text-white">{opt}</span>
                      {compShowFeedback && isCorrect && <Check className="w-6 h-6 text-emerald-400 flex-shrink-0" />}
                      {compShowFeedback && isSelected && !isCorrect && <X className="w-6 h-6 text-red-400 flex-shrink-0" />}
                    </div>
                  </button>
                );
              })}
            </div>
            {compShowFeedback && compErrors[compTurn] < 3 && (
              <button onClick={compNext} className="w-full mt-5 py-3 bg-gradient-to-r from-amber-500 to-red-700 hover:from-amber-600 hover:to-red-800 text-white font-bold rounded-xl flex items-center justify-center gap-2">
                Nächste Runde <ArrowRight className="w-5 h-5" />
              </button>
            )}
          </div>
        </div>
      </div>
    );
  }

  if (screen === 'comp_end') {
    const winnerName = compWinner === 1 ? compP1 : compP2;
    return (
      <div className="min-h-screen bg-gradient-to-br from-stone-950 via-red-950/40 to-stone-950 flex items-center justify-center p-4">
        <div className="max-w-2xl w-full bg-zinc-900/80 backdrop-blur-sm rounded-3xl p-8 shadow-2xl border-2 border-amber-500/50 text-center">
          <div className="inline-flex items-center justify-center w-24 h-24 bg-gradient-to-br from-amber-400 to-red-600 rounded-full mb-4 shadow-2xl shadow-amber-500/50 animate-pulse">
            <Trophy className="w-14 h-14 text-white" />
          </div>
          <h1 className="text-4xl font-bold bg-gradient-to-r from-amber-300 to-red-400 bg-clip-text text-transparent mb-2">{winnerName} löst den Fall!</h1>
          <p className="text-stone-300 mb-6">Großartige Ermittlung — {compRound} Runden!</p>
          <div className="space-y-3">
            <button onClick={() => setScreen('comp_lobby')} className="w-full py-3 bg-gradient-to-r from-amber-500 to-red-700 hover:from-amber-600 hover:to-red-800 text-white font-bold rounded-xl flex items-center justify-center gap-2">
              <RefreshCw className="w-5 h-5" /> Revanche
            </button>
            <button onClick={() => setScreen('start')} className="w-full py-2 text-stone-400 hover:text-white">Zurück zum Start</button>
          </div>
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
